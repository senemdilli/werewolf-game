[project]
name = "wolf-llm-labeling"
version = "0.1.0"
description = "LLM trust-labeling experiments for Werewolf game records."
requires-python = ">=3.14"
dependencies = [
    "langchain==1.3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

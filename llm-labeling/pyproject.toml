[project]
name = "wolf-llm-labeling"
version = "0.1.0"
description = "LLM trust-labeling experiments for Werewolf game records."
requires-python = ">=3.14"
dependencies = [
    "langchain==1.3.10",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
